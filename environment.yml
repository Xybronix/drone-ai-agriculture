# =============================================================================
# Drone AI Agriculture - Conda Environment
# Usage: conda env create -f environment.yml
# Activate: conda activate drone-ai-agriculture
# =============================================================================

name: drone-ai-agriculture
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.10

  # Core Framework
  - pip

  # Machine Learning
  - tensorflow=2.15.0
  - keras=2.15.0
  - scikit-learn=1.3.2
  - scipy=1.11.4
  
  # Data Processing
  - numpy=1.24.3
  - pandas=2.0.3
  - pillow=10.1.0
  - opencv=4.8.1

  # Visualization
  - matplotlib=3.8.2
  - seaborn=0.13.0
  
  # Jupyter
  - jupyter
  - ipykernel
  - ipywidgets
  
  # Utilities
  - pyyaml
  - tqdm
  - requests
  
  # Development
  - pytest
  - black
  - flake8
  
  # Pip dependencies (not available on conda)
  - pip:
    - fastapi==0.104.1
    - uvicorn[standard]==0.24.0
    - python-multipart==0.0.6
    - python-jose[cryptography]==3.3.0
    - passlib[bcrypt]==1.7.4
    - pydantic==2.5.2
    - pydantic-settings==2.1.0
    - onnx==1.15.0
    - onnxruntime==1.16.3
    - tf2onnx==1.16.1
    - tensorflow-hub==0.15.0
    - albumentations==1.3.1
    - sqlalchemy==2.0.23
    - aiosqlite==0.19.0
    - alembic==1.13.0
    - httpx==0.25.2
    - aiohttp==3.9.1
    - websockets==12.0
    - python-socketio==5.10.0
    - boto3==1.34.0
    - minio==7.2.0
    - prometheus-client==0.19.0
    - structlog==23.2.0
    - python-dotenv==1.0.0
    - click==8.1.7
    - kaggle==1.5.16
    - gdown==5.1.0
    - roboflow==1.1.10
    - pytest-asyncio==0.21.1
    - pytest-cov==4.1.0

# Environment variables (optional)
variables:
  PYTHONPATH: "${CONDA_PREFIX}/lib/python3.10/site-packages"